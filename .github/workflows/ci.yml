name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      GEMINI_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Validation tests
        run: npm run test:validation

      - name: Error formatting tests
        run: npm run test:errors

      - name: Security regression tests
        run: npm run test:security

      - name: Published content tests
        run: npm run test:content

      - name: Tier mapping tests
        run: npm run test:tiers

      - name: Credit ledger invariant tests
        run: npm run test:credits

      - name: AI benchmark evaluator tests
        run: npm run test:ai-benchmark

      - name: Build
        run: npm run build

  credit-integration:
    name: Credit & payment integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arro
          POSTGRES_PASSWORD: arro
          POSTGRES_DB: arro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arro:arro@localhost:5432/arro
      DIRECT_URL: postgresql://arro:arro@localhost:5432/arro
      MIDTRANS_SERVER_KEY: SB-Mid-server-ci-integration-key-0000000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stub Supabase auth schema
        run: |
          PGPASSWORD=arro psql -h localhost -U arro -d arro -c \
            "create schema auth; create function auth.uid() returns uuid language sql stable as 'select null::uuid';"

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Schema matches migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Credit & payment integration tests
        run: npm run test:credits:db

  # Jalankan lokal: npm run dev & npm run test:backend
  # Atau tambahkan secrets repo + job terpisah jika ingin E2E di CI
